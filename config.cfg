# CipSoft/Tibia 7.72 Server Configuration
# ==============================================================================

BINPATH     = "game/bin"
MAPPATH     = "game/map"
ORIGMAPPATH = "game/origmap"
DATAPATH    = "game/dat"
USERPATH    = "game/usr"
LOGPATH     = "game/log"
SAVEPATH    = "game/save"
MONSTERPATH = "game/mon"
NPCPATH     = "game/npc"

# SharedMemories
SHM = 10011

# DebugLevel
DebugLevel = 2

# Server-Takt
Beat = 50

# QueryManager
QueryManager = {("127.0.0.1",7173,"nXE?/>j`"),("127.0.0.1",7174,"nXE?/>j`"),("127.0.0.1",7175,"nXE?/>j`"),("127.0.0.1",7176,"nXE?/>j`")}

# Weltstatus
World = "Zanera"
State = public

# Network Configuration
login_port = 7171
game_port = 7172
bind_address = "0.0.0.0"
world_address = "127.0.0.1"
world_name = "Zanera"

# Capacity & Connection Limits
max_players = 1000
max_connections = 1100
connection_timeout = 30

# Game Data Paths
data_path = "game/dat"
map_path = "game/map"
save_path = "game/save"
log_path = "game/log"

# ==============================================================================
# Database Configuration
# ==============================================================================
# Driver type: "sqlite", "mysql", or "postgres"
db_type = "sqlite"

# Player storage mode:
# "database" = stores player skills, inventory, depots, and states in the database (MySQL/PostgreSQL/SQLite)
# "files"    = stores player data in legacy text files (usr/*.usr)
player_storage_mode = "files"

# --- SQLite Configuration (when db_type = "sqlite") ---
database_file = "tibia.db"

# --- MySQL / MariaDB Configuration (when db_type = "mysql") ---
# Fully compatible with phpMyAdmin and OTServ AACs
mysql_host = "127.0.0.1"
mysql_port = 3306
mysql_user = "root"
mysql_password = ""
mysql_database = "tibia"
mysql_reconnect = true

# --- PostgreSQL Configuration (when db_type = "postgres") ---
pg_host = "127.0.0.1"
pg_port = 5432
pg_user = "postgres"
pg_password = ""
pg_database = "tibia"

# RSA Private Key
rsa_key_file = "tibia.pem"

# Message of the Day (MOTD)
motd = "Welcome to Tibia!"

# ==============================================================================
# OTServList & Status Protocol Configuration (TSQP 1.0)
# ==============================================================================
server_name = "Tibia 7.72 Classic"
owner_name = "Admin"
owner_email = "admin@tibia.local"
server_url = "https://otservlist.org"
server_location = "Brazil"
status_timeout = 5000

# ==============================================================================
# Server Multipliers & Rates
# ==============================================================================
rate_exp = 1
rate_skill = 1
rate_magic = 1
rate_loot = 1
rate_spawn = 1
rate_hp_regen = 1
rate_mana_regen = 1

# ==============================================================================
# Gameplay & Item Consumption
# ==============================================================================
# When set to true, players must learn/buy spells from NPCs before casting them.
# When set to false, spells are automatically available once level, magic level, and vocation requirements are met.
learn_spells = false

# Sends the food time to the client for the skills window (The Forgotten Client
# with GameRegenerationTime = true in features.lua). Not part of the 7.72
# protocol: keep false when you play with the original 7.72 Tibia.exe.
send_food_time = true

# Sends the level of the speaking player with every chat message, shown as
# "Name [level]: text" (The Forgotten Client with GameMessageLevel = true in
# features.lua). Not part of the 7.72 protocol: keep false when you play with
# the original 7.72 Tibia.exe.
send_message_level = true

# Sends the player icons as two bytes with a "protection zone" flag, shown as
# a pigeon icon (The Forgotten Client with GamePlayerIconsU16 = true in
# features.lua). The original 7.72 Tibia.exe does not support this.
send_pz_icon = true

# Sends the real liquid type of fluid containers and pools instead of only the
# color, so the client can tell e.g. mana fluid and wine apart (hotkeys). The
# Forgotten Client needs GameNewFluids = true in features.lua. The original
# 7.72 Tibia.exe does not support this.
send_liquid_type = true

# Stamina like Tibia 8.6: 42:00 hours, one minute is used per minute of
# fighting monsters and it regenerates while logged out (after 10 minutes,
# 1 min per 3 min up to 40:00, then 1 min per 10 min). 42-40h: +50% exp for
# premium accounts, below 14h: half exp, 0: no exp and no loot. Sent to the
# client: The Forgotten Client needs GameStamina = true in features.lua. The
# original 7.72 Tibia.exe does not support this.
send_stamina = true

# Sends the outfit window as a list with names (like later clients) instead of
# a range, with the 7.92 outfits: old and new versions after each other, then
# the 7.8+ outfits. Needs the Tibia.dat/Tibia.spr with the 7.92 outfits and
# GameNewOutfitProtocol = true in features.lua (The Forgotten Client). The
# original 7.72 Tibia.exe does not support this.
send_outfit_list = true

# NPC trade window like later clients: say "hi" and then "trade" to an NPC that
# has a list in npcshops.dat (data directory) to buy and sell in a window.
# The Forgotten Client supports this window. The original 7.72 Tibia.exe does
# not support this.
send_npc_trade = true

# While walking (e.g. auto walk after a map click) actions work like in TFS:
# using ("use with" too), moving and turning objects within reach (inventory
# or next to you) happen right away and you keep walking; for an object that
# is too far away you walk to it first. Talking and spells don't stop the
# walk and you attack your target while walking. Walking by hand, a new map
# click, stop/escape, follow and chase mode still replace the walk.
# When set to false, actions within reach also happen right away when
# standing still, without the short delay of 7.72. Pushing creatures and the
# delay of runes on targets stay as they are. Works with every client.
one_action_delay = false

# When set to false, runes will not lose charges or be deleted upon use
remove_charges_from_runes = true

# When set to false, vials/potions (mana/life fluids) will not be emptied upon use
remove_charges_from_vials = false

# When set to false, ammunition and thrown weapons will not be consumed/dropped
remove_weapon_ammunition = false

# When set to false, weapons, shields, amulets (unlimited charges) and rings (unlimited time and charges) will not wear out or expire
remove_weapon_charges = false

# When set to true, players have infinite carry capacity / ignore item weight
free_capacity = false

# When set to true, the game world is fully illuminated (always full light)
always_light = false

# When set to true, all players automatically have premium account privileges (spells, boats, outfits, houses)
free_premium = false

# Multiplies what conjure spells create: runes per cast (e.g. sudden death
# 1 -> 2), ammunition per cast (exevo con 10 -> 20) and food per cast.
rate_conjure_rune = 2
rate_conjure_ammo = 2
rate_conjure_food = 2

# Multiplies the price NPCs ask for (and pay for) spell runes.
rate_npc_rune_price = 3

# When set to false, fishing does not need (or use up) worms.
require_worms_for_fishing = false

# Maximum summons per player (convince creature / summon)
max_summons_per_player = 2

# ==============================================================================
# Combat & Timers
# ==============================================================================
# Attack interval in milliseconds (default: 2000 = 2 seconds)
attack_interval = 2000

# Defense/shield interval in milliseconds (default: 2000 = 2 seconds)
defense_interval = 2000

# Global spell exhaustion/cooldown in milliseconds (default: 1000 = 1 second)
spell_exhaustion = 1000

# Rune exhaustion/cooldown in milliseconds (default: 2000 = 2 seconds)
rune_exhaustion = 2000

# Delay when jumping stairs/changing floors before acting (default: 2000 ms)
stair_jump_exhaustion = 2000

# ==============================================================================
# PvP & Skulls
# ==============================================================================
# World type: "pvp" (normal), "no-pvp" (non-pvp), "pvp-enforced"
world_type = "pvp"

# Minimum level to participate in PvP combat
protection_level = 1

# Unjustified kills to acquire Red Skull (day, week, month)
kills_to_red_skull = 3
kills_to_red_skull_week = 5
kills_to_red_skull_month = 10

# Unjustified kills to trigger banishment / excessive killing
kills_to_ban = 6
kills_to_ban_week = 10
kills_to_ban_month = 20

# Duration in seconds for White Skull (default: 900 = 15 minutes)
white_skull_time = 900

# Duration in seconds for in-fight / logout lock (default: 60 = 1 minute)
in_fight_time = 60

# Duration in seconds for Red Skull (default: 2592000 = 30 days)
red_skull_duration = 2592000

# ==============================================================================
# Death & Losses
# ==============================================================================
# Base percentage of experience/skills lost on death (default: 10%)
death_lose_percent = 10

# Whether players gain experience by killing other players
experience_by_killing_players = false

# Percentage of victim experience awarded to killer in PvP-Enforced mode (default: 5%)
pvp_enforced_exp_percent = 5

# ==============================================================================
# Soul Points
# ==============================================================================
# Whether spells and runes require and consume Soul Points
enable_soul_points = true

# Interval in seconds to regenerate 1 Soul Point (regular / promoted)
soul_regen_interval = 120
soul_regen_interval_promoted = 15

# ==============================================================================
# Houses
# ==============================================================================
# Minimum character level required to buy a house
house_buy_level = 1

# Restrict house ownership to premium accounts only
house_only_premium = true


