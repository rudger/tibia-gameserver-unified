# Extra attributes on monster loot.
#
# When a monster dies, every item it drops has a small chance to get one extra
# attribute. It shows when you look at the item, e.g.
#   "You see a sword (Atk:14 +2 Def:12)."
#   "You see a steel helmet (Arm:6 +1)."
#   "You see a spellbook (magic level +1)."
#
# This file belongs next to config.cfg. Missing values keep the defaults shown
# here. The bonus is a random number between min and max (both included).

# Chance in percent (0-100) that a dropped item gets an extra attribute.
chance = 5

# Club, axe and sword weapons: extra attack.
weapon_attack_min = 1
weapon_attack_max = 3

# Helmets, armors, legs, boots and shields: extra armor.
armor_min = 1
armor_max = 2

# Amulets and necklaces: extra armor.
amulet_armor_min = 1
amulet_armor_max = 2

# Spellbooks (in a hand): extra magic level for spell damage.
spellbook_magic_level_min = 1
spellbook_magic_level_max = 1

# Wands and rods: extra damage per shot.
wand_damage_min = 1
wand_damage_max = 5
